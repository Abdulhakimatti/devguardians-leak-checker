{% extends "base.html" %}
{% block title %}تسجيل الدخول - DevGuardians{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 420px;">
  <h1 class="h3 fw-bold mb-4">دخول المدير</h1>
  {% if disabled %}
    <div class="alert alert-warning">
      صفحة السجلات متوقفة لأنك لم تضع كلمة مرور المدير. اتبع خطوات الإعداد في README.
    </div>
  {% else %}
    <form method="post" class="panel">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password" class="form-label">كلمة المرور</label>
      <input id="password" name="password" type="password" class="form-control mb-3" required>
      <button class="btn btn-dg w-100">دخول</button>
    </form>
  {% endif %}
</div>
{% endblock %}
