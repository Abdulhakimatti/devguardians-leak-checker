<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevGuardians | سجل قاعدة البيانات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        .table-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold text-info">🗄️ قاعدة بيانات النظام (SQLite)</h1>
                <p class="text-secondary mb-0">سجل البريد الإلكتروني المفحوصة والمحفوظة في قاعدة البيانات</p>
            </div>
            <a href="/" class="btn btn-outline-light">العودة للرئيسية 🏠</a>
        </div>

        <div class="table-card p-4 shadow-lg">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th># ID</th>
                            <th>البريد الإلكتروني</th>
                            <th>حالة الأمان</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in records %}
                        <tr>
                            <td>{{ row[0] }}</td>
                            <td class="fw-bold">{{ row[1] }}</td>
                            <td>
                                {% if row[2] == 1 %}
                                    <span class="badge bg-danger">مسرب (Leaked) ⚠️</span>
                                {% else %}
                                    <span class="badge bg-success">آمن (Secure) ✅</span>
                                {% endif %}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
